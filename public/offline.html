<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — Construction Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #0c0c0e;
      color: #dedad2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 22px; font-weight: 900; margin-bottom: 10px; }
    p  { font-size: 14px; color: #7a7870; line-height: 1.6; max-width: 280px; }
    .btn {
      margin-top: 28px;
      padding: 14px 32px;
      background: #d48c28;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.85; }
    .sub { margin-top: 12px; font-size: 12px; color: #4a4840; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>Construction Manager needs an internet connection to load your data. Please check your connection and try again.</p>
  <button class="btn" onclick="window.location.reload()">↻ Try Again</button>
  <p class="sub">CM App · Construction Manager</p>
</body>
</html>
